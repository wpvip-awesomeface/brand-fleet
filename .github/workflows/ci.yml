# Runs on every PR and every push to main: PHP + JS syntax check, then the
# WordPress VIP coding standard (phpcs.xml.dist). Uses the PHP and Composer
# that ship on the GitHub runner, so no third-party setup action is needed.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax (PHP + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: bash scripts/lint.sh

  phpcs:
    name: WordPress VIP coding standard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install coding standards (locked versions)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: phpcs
        run: vendor/bin/phpcs --report-full --report-checkstyle=phpcs-report.xml

      - name: Annotate findings on the PR
        if: failure()
        run: |
          php -r '
            $xml = @simplexml_load_file( "phpcs-report.xml" );
            if ( ! $xml ) { exit; }
            foreach ( $xml->file as $file ) {
              $path = str_replace( getcwd() . "/", "", (string) $file["name"] );
              foreach ( $file->error as $e ) {
                printf( "::%s file=%s,line=%d::%s\n", (string) $e["severity"], $path, (int) $e["line"], (string) $e["message"] );
              }
            }
          '
